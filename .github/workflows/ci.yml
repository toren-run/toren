name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toren
          POSTGRES_PASSWORD: toren
          POSTGRES_DB: toren
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U toren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # vitest resolves @toren-run/console through its built entry.
      - run: pnpm build
      # The full suite includes the chaos kill matrices: the stack is crashed
      # after every database write point and each model call must be billed
      # exactly once. Live-provider and E2B tests self-skip without keys.
      # The docker sandbox suites are local-only for now: writes inside
      # containers do not persist on Azure-hosted runners (runner-level
      # restriction, reproduced nowhere else).
      - run: pnpm test
        env:
          TOREN_SKIP_DOCKER_TESTS: "1"

name: Bug report
description: Something broke, misbehaved, or lied to you
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Paste real output; error messages are welcome here.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the event log (if you have it)
      description: "Every run is queryable: `toren jobs show <runId>`, or SQL against agent_<name>.events. Paste anything relevant."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "toren-run@0.1.3, node 22, postgres 16, local | compose | AWS"
    validations:
      required: true
